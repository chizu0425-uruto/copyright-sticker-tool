<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>©一括追加工房</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3f7f3;color:#25372f;margin:0}main{max-width:740px;margin:auto;padding:22px}h1{font-size:1.55rem}section{background:white;padding:18px;border-radius:15px;margin:16px 0;box-shadow:0 2px 12px #173a2312}label{display:block;margin:12px 0 5px;font-weight:600}input[type=file]{width:100%}input[type=range]{width:100%}button{border:0;border-radius:10px;background:#3d7359;color:white;padding:12px 18px;font-size:1rem;font-weight:650;cursor:pointer;margin:6px 6px 6px 0}button:disabled{opacity:.4}small{color:#536b5b}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}figure{margin:0;background:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border-radius:8px;padding:8px}canvas{max-width:100%;height:auto;display:block;margin:auto}figcaption{overflow-wrap:anywhere;font-size:12px;background:#fff9;padding:3px}input[type=text]{padding:8px;border:1px solid #b4c7b9;border-radius:8px;width:min(95%,350px)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row label{flex:1;min-width:190px}#status{font-weight:600}</style></head><body><main><h1>🐾 ©一括追加工房</h1><p>分割済みの透過PNGに、白フチ付きの著作権表記をまとめて追加します。画像は端末内で処理され、外部に送信されません。</p><section><label for="files">PNG画像を選択（複数可）</label><input id="files" type="file" accept="image/png" multiple><label for="mark">追加する文字</label><input id="mark" type="text" value="©uruto1848"><div class="row"><label>文字サイズ <span id="sizeVal">5</span>%<input id="size" type="range" min="2" max="12" value="5"></label><label>白フチの太さ <span id="strokeVal">2</span><input id="stroke" type="range" min="1" max="6" value="2"></label></div><label>文字の色 <input id="color" type="color" value="#333333"></label><label>下端からの余白 <span id="marginVal">3</span>%<input id="margin" type="range" min="0" max="15" value="3"></label><p><small>文字は画像の下部中央に配置。元の絵柄・画像サイズ・透過部分は維持します。既存の絵柄と重なる場合は余白を調整してください。</small></p><button id="render" disabled>プレビュー更新</button><button id="save" disabled>全画像をZIP保存</button><p id="status" role="status">画像を選択してください。</p></section><section><h2>プレビュー</h2><div id="gallery"></div></section></main><script>
'use strict';
const $ = id => document.getElementById(id);
let originals = [], outputs = [], revision = 0;
const status = message => { $('status').textContent = message; };
function loadImage(file) {
  return new Promise((resolve,reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を開けませんでした')); };
    img.src = url;
  });
}
for (const id of ['size','stroke','margin']) {
  $(id).addEventListener('input', () => {
    $(id+'Val').textContent = $(id).value;
    if(originals.length) render();
  });
}
for (const id of ['mark','color']) $(id).addEventListener('input', () => {if(originals.length)render();});
$('files').addEventListener('change', async () => {
  const token = ++revision;
  originals = []; outputs = [];
  $('render').disabled = true; $('save').disabled = true;
  $('gallery').replaceChildren();
  const files = Array.from($('files').files || []);
  if (!files.length) {status('画像を選択してください。');return;}
  status(`${files.length}枚の画像を読み込み中…`);
  let failed = [];
  for (const file of files) {
    if (token !== revision) return;
    if (!/\.png$/i.test(file.name) && file.type !== 'image/png') { failed.push(file.name+'（PNG以外）'); continue; }
    try { const img = await loadImage(file); originals.push({name:file.name,img}); }
    catch (e) { failed.push(file.name+'（'+e.message+'）'); }
  }
  if (token !== revision) return;
  $('render').disabled = !originals.length;
  if (!originals.length) {status('画像を読み込めませんでした。'+failed.join('、'));return;}
  await render();
  if (failed.length) status($('status').textContent+' 読み込み失敗: '+failed.join('、'));
});
$('render').addEventListener('click',render);
async function render() {
  if (!originals.length) {status('画像を選択してください。');return;}
  const token = ++revision;
  outputs = [];
  $('save').disabled = true;
  $('gallery').replaceChildren();
  status(`${originals.length}枚を処理中…`);
  const mark = $('mark').value || '©uruto1848';
  const sizePct = Number($('size').value), strokePct = Number($('stroke').value), marginPct = Number($('margin').value), color = $('color').value;
  const results = [];
  try {
    for (const {name,img} of originals) {
      if (token !== revision) return;
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      if(!c.width || !c.height) throw new Error(name+' のサイズを取得できません');
      const ctx = c.getContext('2d');
      if(!ctx) throw new Error('画像処理を開始できません');
      ctx.drawImage(img,0,0);
      const size = Math.max(8,Math.round(c.width*sizePct/100));
      ctx.font = `600 ${size}px system-ui,sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.lineJoin = 'round';
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1,size*strokePct/10);
      ctx.fillStyle = color;
      const y = c.height-c.height*marginPct/100;
      ctx.strokeText(mark,c.width/2,y,c.width*.94);
      ctx.fillText(mark,c.width/2,y,c.width*.94);
      const blob = await new Promise((resolve,reject) => c.toBlob(b => b ? resolve(b) : reject(new Error('PNGへの変換に失敗しました')),'image/png'));
      if(token !== revision)return;
      results.push({name:name.replace(/\.png$/i,'')+'_copyright.png',blob});
      const fig=document.createElement('figure');
      const preview=document.createElement('canvas');
      const scale=Math.min(1,240/c.width);
      preview.width=Math.max(1,Math.round(c.width*scale));
      preview.height=Math.max(1,Math.round(c.height*scale));
      preview.getContext('2d').drawImage(c,0,0,preview.width,preview.height);
      const cap=document.createElement('figcaption'); cap.textContent=name;
      fig.append(preview,cap); $('gallery').append(fig);
    }
    if(token !== revision)return;
    outputs=results; $('save').disabled=false;
    status(`${outputs.length}枚のプレビューができました。`);
  } catch(e) {
    if(token !== revision)return;
    outputs=[]; $('save').disabled=true;
    status('処理エラー: '+(e.message||String(e)));
  }
}
function crc32(bytes){let crc=-1;for(const b of bytes){crc^=b;for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return(crc^-1)>>>0}
function u16(n){return[n&255,(n>>>8)&255]}
function u32(n){return[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
async function makeZip(items){let parts=[],central=[],offset=0;for(const item of items){const name=new TextEncoder().encode(item.name);const data=new Uint8Array(await item.blob.arrayBuffer());const crc=crc32(data);const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name]);parts.push(local,data);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]));offset+=local.length+data.length}const centralSize=central.reduce((n,b)=>n+b.length,0);return new Blob([...parts,...central,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(items.length),...u16(items.length),...u32(centralSize),...u32(offset),...u16(0)])],{type:'application/zip'})}
$('save').addEventListener('click',async()=>{
  if(!outputs.length)return;
  $('save').disabled=true;status('ZIPを作成中…');
  try {
    const zip=await makeZip(outputs);
    const url=URL.createObjectURL(zip);
    const a=document.createElement('a');a.href=url;a.download='uruto1848_digital_stickers.zip';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    status(`${outputs.length}枚をZIPにまとめました。`);
  }catch(e){status('保存エラー: '+(e.message||String(e)));}
  finally{$('save').disabled=!outputs.length;}
});
</script></body></html>
